name: Automated Bot Guardrail

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  audit-bot-pr:
    name: Audit Bot PR Diff & Guardrails
    runs-on: ubuntu-latest
    if: contains(github.actor, 'jules') || contains(github.actor, 'sentinel') || contains(github.head_ref, 'sentinel') || contains(github.head_ref, 'jules') || contains(github.head_ref, 'bolt') || contains(github.head_ref, 'palette')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Diff for Bot Regressions, Zero-Diffs & Conflict Markers
        run: |
          echo "=== Auditing PR Diff for Bot Regressions, Hallucinations & Conflict Markers ==="

          # 1. Reject Unresolved Git Merge Conflict Markers
          CONFLICTS=$(git diff origin/${{ github.base_ref }}...HEAD | grep -E '^\+\s*(\<{7}|\={7}|\>{7}|\|{7})' || true)
          if [ -n "$CONFLICTS" ]; then
            echo "❌ ERROR: PR adds unresolved Git merge conflict markers (<<<<<<<, =======, >>>>>>>). Auto-failing."
            echo "$CONFLICTS"
            exit 1
          fi

          # 2. Reject Zero-Diff / Hallucinatory Acknowledgment PRs
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -v '^\.jules/' | grep -v '^\.Jules/' | grep -v 'package.*json' | grep -v 'composer\.lock' | grep -v 'pnpm-lock\.yaml' | grep -v 'mix\.lock' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "❌ ERROR: PR contains 0 non-metadata code changes (hallucinatory task acknowledgment). Auto-failing."
            exit 1
          fi

          # 3. Reject Forbidden Scratch Verification Files
          SCRATCH_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^test(_.*)?\.(ts|js|cjs|mjs|py|php)$|^fix_.*\.(php|cjs|js|ts)$|^update_.*\.(php|cjs|js|ts)$|^scratch_.*|.*\.scratch$' || true)
          if [ -n "$SCRATCH_FILES" ]; then
            echo "❌ ERROR: PR contains forbidden scratch verification files:"
            echo "$SCRATCH_FILES"
            exit 1
          fi

          # 4. Reject Destructive Line Deletions in Critical Entrypoints & Schemas
          DELETED_LINES=$(git diff --stat origin/${{ github.base_ref }}...HEAD | grep -E 'schema\.prisma|src/index\.ts|public/index\.php|docker/postgres/init/|routes/|routes\.php' | awk '{print $5}' | grep '-' || true)
          for count in $DELETED_LINES; do
            num=$(echo "$count" | tr -d '-')
            if [ "$num" -gt 15 ]; then
              echo "❌ ERROR: PR deletes $num lines from a core schema or entrypoint file, exceeding safety threshold (max 15)."
              exit 1
            fi
          done

          echo "✅ Bot Guardrail Passed: Diff is safe, functional, and clean."
